<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ENSTP 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:#fff}
body{margin:0;background:#fff;color:#000;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-align:center}
main{display:flex;flex-direction:column;align-items:center;padding:clamp(32px,6vw,72px) 24px clamp(64px,10vw,120px)}
.logo{width:min(340px,64vw);height:auto;display:block}
.lead{margin:clamp(24px,4vw,48px) 0 0;font-weight:300;font-size:clamp(1.5rem,4.2vw,2.75rem);letter-spacing:-.02em;line-height:1.2}
.gap{height:100vh;min-height:700px;width:1px}
.punch{margin:0;font-weight:800;font-size:clamp(2.4rem,8.5vw,6rem);letter-spacing:-.045em;line-height:1.02}
.follow{margin:clamp(20px,3vw,32px) 0 0;font-weight:400;font-size:clamp(1rem,2vw,1.25rem);letter-spacing:.01em}
.btn{display:inline-flex;align-items:center;gap:.6em;margin-top:clamp(28px,4vw,44px);padding:18px 38px;background:#000;color:#fff;text-decoration:none;font-weight:800;font-size:.9rem;letter-spacing:.18em;border-radius:999px;border:1px solid #000;transition:transform .25s ease,background .25s ease,color .25s ease,box-shadow .25s ease}
.btn span{display:inline-block;transition:transform .25s ease}
.btn:hover,.btn:focus-visible{transform:translateY(-3px);background:#fff;color:#000;box-shadow:0 10px 24px rgba(0,0,0,.15);outline:none}
.btn:hover span,.btn:focus-visible span{transform:translate(3px,-3px)}
.btn:active{transform:translateY(-1px)}
.ssc{width:min(240px,56vw);height:auto;display:block;margin-top:clamp(28px,4vw,48px)}
@media(max-width:480px){.gap{min-height:620px}.btn{padding:16px 30px}}
</style>
</head>
<body>
<main>
<img class="logo" src="logo-enstp360.png" alt="ENSTP 360 – Une vision, sans angle mort.">
<p class="lead">Congratulations, you are smart…</p>
<div class="gap" aria-hidden="true"></div>
<h1 class="punch">But not smarter than us.</h1>
<p class="follow">Follow SSC to stay tuned.</p>
<a class="btn" href="https://ssc.enstp">FOLLOW SSC <span>↗</span></a>
<img class="ssc" src="logo-ssc.png" alt="SSC – Students Sports Community">
</main>
</body>
</html>
