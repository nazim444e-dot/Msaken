<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ENSTP 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{background:#fff}
body{margin:0;background:#fff;color:#000;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-align:center}
.hero{display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100svh;padding:calc(clamp(28px,5vw,64px) + env(safe-area-inset-top,0px)) 24px 0;overflow:hidden}
.logo{width:min(340px,64vw);height:auto;display:block}
.lead{margin:clamp(24px,4vw,48px) 0 0;font-weight:300;font-size:clamp(1.5rem,4.2vw,2.75rem);letter-spacing:-.02em;line-height:1.2}
.but{margin:auto 0 0;display:flex;justify-content:center;font-weight:800;font-size:clamp(7rem,34vw,20rem);letter-spacing:-.06em;line-height:.8;padding-bottom:calc(.12em + env(safe-area-inset-bottom,0px))}
.but span{display:inline-block;opacity:0;transform:translateY(.18em);animation:pop .6s cubic-bezier(.2,.8,.2,1) forwards}
.but span:nth-child(1){animation-delay:.7s}
.but span:nth-child(2){animation-delay:.95s}
.but span:nth-child(3){animation-delay:1.2s}
@keyframes pop{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.but span{animation:none;opacity:1;transform:none}}
.rest{display:flex;flex-direction:column;align-items:center;padding:clamp(28px,5vw,48px) 24px calc(clamp(64px,10vw,120px) + env(safe-area-inset-bottom,0px))}
.better{margin:0;font-weight:800;font-size:clamp(2.4rem,8.5vw,6rem);letter-spacing:-.045em;line-height:1.02}
.discover{margin:clamp(24px,4vw,40px) 0 0;font-weight:800;font-size:clamp(1.25rem,3vw,1.75rem);letter-spacing:-.02em}
.follow{margin:10px 0 0;font-weight:400;font-size:clamp(1rem,2vw,1.25rem);letter-spacing:.01em}
.btn{display:inline-flex;align-items:center;gap:.6em;margin-top:clamp(28px,4vw,44px);padding:18px 38px;background:#000;color:#fff;text-decoration:none;font-weight:800;font-size:.9rem;letter-spacing:.18em;border-radius:999px;border:1px solid #000;transition:transform .25s ease,background .25s ease,color .25s ease,box-shadow .25s ease}
.btn span{display:inline-block;transition:transform .25s ease}
.btn:hover,.btn:focus-visible{transform:translateY(-3px);background:#fff;color:#000;box-shadow:0 10px 24px rgba(0,0,0,.15);outline:none}
.btn:hover span,.btn:focus-visible span{transform:translate(3px,-3px)}
.btn:active{transform:translateY(-1px)}
.ssc{width:min(240px,56vw);height:auto;display:block;margin-top:clamp(28px,4vw,48px)}
@media(max-width:480px){.btn{padding:16px 30px}}
</style>
</head>
<body>
<section class="hero">
<img class="logo" src="IMG_2131.png" alt="ENSTP 360 – Une vision, sans angle mort.">
<p class="lead">Every website is good</p>
<div class="but" aria-label="BUT"><span aria-hidden="true">B</span><span aria-hidden="true">U</span><span aria-hidden="true">T</span></div>
</section>
<main class="rest">
<h1 class="better">Ours is just better</h1>
<p class="discover">Discover ENSTP 360</p>
<p class="follow">Follow for all the latest updates</p>
<a class="btn" href="https://www.instagram.com/ssc.enstp">SSC <span>↗</span></a>
<img class="ssc" src="IMG_2128.png" alt="SSC – Students Sports Community">
</main>
</body>
</html>
